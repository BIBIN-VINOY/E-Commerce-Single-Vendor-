{% load static %}
{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

 <link rel="stylesheet" href="{% static 'css/auth.css' %}">

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Reset Password</h1>

        <p>
            Enter your email address and
            we'll send a password reset link.
        </p>

        <form>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="bibin@example.com"
                >

            </div>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="auth-links">

            <a href="#">
                Back To Login
            </a>

        </div>

    </div>

</div>

{% endblock %}

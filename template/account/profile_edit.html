{% extends 'base.html' %}
{% load static %}

{% block title %}
Edit Profile
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}

<div class="profile-container">

    <div class="form-card">

        <h2>Edit Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">

                <label>Profile Image</label>

                {{form.profile_image}}

            </div>

            <div class="form-group">

                <label>Username</label>

                {{form.username}}

            </div>

            <div class="form-group">

                <label>Email</label>

                {{form.email}}

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                {{form.phone}}

            </div>

            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
